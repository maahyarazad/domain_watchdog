openapi: 3.1.0
info:
  title: Domain Watchdog API — chart extension
  version: 1.1.0
  description: Adds the chart-series endpoint to the API defined in specs/001-domain-uptime-watchdog/contracts/openapi.yaml.
paths:
  /api/domains/{hostname}/chart:
    get:
      summary: Response-time series and downtime periods for one domain
      parameters:
        - name: hostname
          in: path
          required: true
          schema: { type: string }
        - name: range
          in: query
          required: false
          schema:
            type: string
            enum: [1h, 24h, 7d]
            default: 24h
      responses:
        '200':
          description: Chart series
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ChartResponse' }
        '404':
          description: Unknown hostname
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '422':
          description: Invalid range
components:
  schemas:
    ChartResponse:
      type: object
      required: [hostname, range, from, to, bucket_seconds, points, downtime, gaps, summary]
      properties:
        hostname: { type: string }
        range: { type: string, enum: [1h, 24h, 7d] }
        from: { type: string, format: date-time }
        to: { type: string, format: date-time }
        bucket_seconds: { type: integer, enum: [30, 300, 1800] }
        points:
          type: array
          items: { $ref: '#/components/schemas/ChartPoint' }
        downtime:
          type: array
          items: { $ref: '#/components/schemas/DowntimePeriod' }
        gaps:
          type: array
          items: { $ref: '#/components/schemas/Gap' }
        summary: { $ref: '#/components/schemas/ChartSummary' }
    ChartPoint:
      type: object
      required: [t, avg_ms, max_ms, checks, down]
      properties:
        t: { type: string, format: date-time }
        avg_ms: { type: [number, 'null'], description: Mean response time of up checks }
        max_ms: { type: [integer, 'null'] }
        checks: { type: integer, minimum: 1 }
        down: { type: integer, minimum: 0 }
    DowntimePeriod:
      type: object
      required: [started_at, ended_at, failed_checks, errors, ongoing]
      properties:
        started_at: { type: string, format: date-time }
        ended_at: { type: string, format: date-time }
        failed_checks: { type: integer, minimum: 1 }
        errors:
          type: array
          items: { type: string }
        ongoing: { type: boolean }
    Gap:
      type: object
      required: [started_at, ended_at]
      properties:
        started_at: { type: string, format: date-time }
        ended_at: { type: string, format: date-time }
    ChartSummary:
      type: object
      required: [down_periods, total_downtime_seconds, checks]
      properties:
        down_periods: { type: integer, minimum: 0 }
        total_downtime_seconds: { type: integer, minimum: 0 }
        checks: { type: integer, minimum: 0 }
    Error:
      type: object
      required: [detail]
      properties:
        detail: { type: string }
